name: Deploy to GitHub Pages

on:
  # Deploy on every push to main
  push:
    branches: [main]
  # ...and allow manual runs from the Actions tab
  workflow_dispatch:

# Needs write access to push the built site to the gh-pages branch
permissions:
  contents: write

# Don't run two publishes at once
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build
        env:
          # Served from https://<user>.github.io/ObaidOS — must match `basePath`
          # in next.config.ts and the `asset()` helper in lib/asset.ts.
          NEXT_PUBLIC_BASE_PATH: /ObaidOS

      # Publish the built site to the `gh-pages` branch. GitHub Pages (source:
      # "Deploy from a branch" -> gh-pages / root) then serves it asynchronously
      # with no 10-minute action timeout. `.nojekyll` is added automatically so
      # the `_next/` folder is served.
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
